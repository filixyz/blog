# ------------------------------------------------------------------
# Site config. Change baseURL to your real address once deployed
# (Cloudflare Pages gives you https://<project>.pages.dev/).
# ------------------------------------------------------------------
baseURL = "https://example.pages.dev/"
locale = "en"
title = "felix corpus"        # shown top-left and in the footer — change freely
enableRobotsTXT = true
# Only auto-summarise when you place <!--more--> yourself (see README).
summaryLength = 100000

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[params]
  # Text colour. false = plain (grey on near-black / black on white).
  # true = "purple" mode (the blue/lavender lettering) for everyone who has not clicked the circle at the foot of the page.
  purple = false

  # true = code blocks are coloured by language (GitHub style). false = plain code, same colour as the text.
  # Applies to everyone on the next deploy; there is no visitor-side switch.
  syntax = true

  # Banner image: a file in static/, 1600x400 (4:1). Sits under the site name on desktop, under the top bar on phones,
  # running to the screen edge (left on desktop, both sides on phones). Set to "" to hide it.
  header = "header.png"

  # Text typeface: "inter" (default), "wikipedia" (system sans body + serif titles), "mono" (IBM Plex Mono),
  # or "typewriter" (American Typewriter on Macs/iPhones, bundled Arvo slab elsewhere).
  font = "inter"
  description = "personal blog"
  tagline = "felix ikechukwu okoronkwo personal blog"
  # Optional outside link under the tagline. Delete the block to hide it.
  # [params.external]
  #   name = "Bandcamp"
  #   url  = "https://example.com"

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false   # lets image hooks output <figure> without a stray <p>

[markup.goldmark.renderer]
  unsafe = true                 # allow raw HTML (audio tags, line breaks) in Markdown

[markup.highlight]
  noClasses = false             # no colour theme: code stays black & white

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 85

[outputs]
  home = ["HTML", "RSS"]

