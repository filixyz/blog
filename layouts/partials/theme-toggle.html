<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light mode">light</button>
<script>
(function () {
  var b = document.getElementById("theme-toggle"), r = document.documentElement;
  function apply(t) {
    r.setAttribute("data-theme", t);
    var other = t === "light" ? "dark" : "light";
    b.textContent = other;                       /* the button names the mode you will switch to */
    b.setAttribute("aria-label", "Switch to " + other + " mode");
    var m = document.querySelector("meta[name=theme-color]");
    if (m) m.setAttribute("content", t === "light" ? "#ffffff" : "#000000");
  }
  apply(r.getAttribute("data-theme") === "light" ? "light" : "dark");
  b.addEventListener("click", function () {
    var t = r.getAttribute("data-theme") === "light" ? "dark" : "light";
    apply(t);
    try { localStorage.setItem("theme", t); } catch (e) {}
  });
})();
</script>
