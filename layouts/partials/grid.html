{{- /* Thumbnail grid for gallery-style sections (paintings, comics). */ -}}
<ul class="grid">
{{- range . }}
  {{- $p := . }}
  <li><a href="{{ $p.RelPermalink }}">
    {{- with $p.Resources.GetMatch "cover*" }}
      {{- $t := .Fit "720x720 q80" }}
      <img src="{{ $t.RelPermalink }}" width="{{ $t.Width }}" height="{{ $t.Height }}" alt="" loading="lazy">
    {{- else }}<span class="noimg"></span>{{ end }}
    <span>{{ $p.Title }}</span>
  </a></li>
{{- end }}
</ul>
